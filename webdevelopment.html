<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Development</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #333;
      font-family: 'Poppins',sans-serif;
    }
    h1.title {
      text-align:center;
      color: white;
      padding:20px;
      background-color: #2980b9;
    }
    .projects-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      padding: 20px 40px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .project-card {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
      padding: 20px;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      opacity: 1;
    }
    .project-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.12);
    }
    .project-card h3 {
      font-size: 1.4rem;
      color: #34495e;
      margin-bottom: 10px;
    }
    .project-description {
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 12px;
    }
    .project-tech {
      font-size: 0.85rem;
      color: #555;
      font-style: italic;
      margin-bottom: 12px;
    }
    .project-link {
      text-decoration: none;
      background-color: #3498db;
      color: white;
      padding: 8px 16px;
      border-radius: 6px;
      display: inline-block;
      transition: background-color 0.3s ease;
    }
    .project-link:hover {
      background-color: #2980b9;
    }
    .loader {
      text-align: center;
      padding: 20px;
      font-size: 1.1rem;
      color: #777;
    }
    .hidden {
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.5s ease-out;
    }
    .project-card:not(.hidden) {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>

<body>
  <h1 class="title">My Projects</h1>
    <div id="projects-container" class="projects-container"></div>
    <div id="loader" class="loader">Loading...</div>
    <script src="script2.js"></script>
</body>

</html>
