     body {

      /* color: white; */

      overflow-x: hidden;

    h1 {
      text-align: center;
      background-color: rgb(40, 91, 212);
      margin-left: -60px;
      margin-right: -60px;
      padding: 20px;
      position: relative;
      top: -50px;
    }

    h2 {
      text-align: center;
      margin-bottom: 40px;
      position: relative;
      top: -50px;
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px;
      position: relative;
      top: -60px;
    }

    .card-stack {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      transition: background 0.4s ease;
      border-radius: 14px;
    }

    .card {
      position: absolute;
      width: 100%;
      height: 100%;
      border-radius: 10px;
    }

    .page1 {
      background-color: rgb(40, 91, 212);
      z-index: 3;
      overflow: hidden;
    }

    .page2 {
      background-color: rgb(30, 75, 175);
      z-index: 2;
    }

    .page3 {
      background-color: rgb(20, 60, 140);
      z-index: 1;
    }

    @media (max-width: 992px) {
      .card-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .card-grid {
        grid-template-columns: 1fr;
      }
    }
    </style>

</head>
